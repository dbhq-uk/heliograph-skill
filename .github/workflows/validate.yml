name: Validate plugin

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate plugin manifest is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: Check shell scripts parse
        # Root installers included: a syntax error there breaks every install.
        # tests/ included too. The tests job runs those scripts, so a syntax
        # error there does get caught - but as a failing test run in a different
        # job, which reads as "the toolkit is broken" rather than "this file does
        # not parse". Same corpus as AGENTS.md's local command, so the two agree.
        run: |
          fail=0
          while IFS= read -r s; do
            bash -n "$s" || { echo "Syntax error: $s"; fail=1; }
          done < <({ find . -maxdepth 1 -name '*.sh'; find skills tests -name '*.sh'; })
          exit $fail

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning $(find . -name '*.sh' -not -path './.git/*')

      - name: Check SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import sys, pathlib, re
          ok = True
          for skill in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = skill.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---", text, re.S)
              if not m:
                  print(f"{skill}: missing YAML frontmatter"); ok = False; continue
              fm = m.group(1)
              name = re.search(r"^name:\s*(.+)$", fm, re.M)
              desc = re.search(r"^description:\s*(.+)$", fm, re.M)
              if not name:
                  print(f"{skill}: missing 'name'"); ok = False
              else:
                  name = name.group(1).strip()
                  if name != skill.parent.name:
                      print(f"{skill}: name '{name}' != directory '{skill.parent.name}'"); ok = False
                  if not re.fullmatch(r"[a-z0-9-]{1,64}", name):
                      print(f"{skill}: name must be lowercase alphanumeric/hyphen, <=64 chars"); ok = False
              if not desc:
                  print(f"{skill}: missing 'description'"); ok = False
              elif len(desc.group(1).strip()) > 1024:
                  print(f"{skill}: description exceeds 1024 chars"); ok = False
          sys.exit(0 if ok else 1)
          PY

      # The whole install story rests on ${CLAUDE_SKILL_DIR} being substituted.
      # A hardcoded ~/.claude/skills path works on the author's machine and is
      # wrong under both a Codex install and a plugin install.
      - name: No hardcoded install paths
        run: |
          if grep -rn '~/\.claude/skills\|\$HOME/\.claude/skills' skills/; then
            echo "::error::Hardcoded install path found. Use \${CLAUDE_SKILL_DIR} instead."
            exit 1
          fi
          echo "No hardcoded install paths."

      # House style is a plain hyphen. Cheap to assert, and it drifts back in
      # every time a paragraph is pasted from somewhere else.
      #
      # *.yml is deliberately NOT added to this scan, even though house style
      # (and this PR's own task brief) applies to workflow prose too: this
      # very step's own search pattern is a literal em dash character inside
      # a *.yml file, so including *.yml here would make the check match
      # itself on every run, unconditionally. publish-image.yml and this
      # job's own new comments were checked by hand for the task instead (see
      # the task 4 report) - genuinely clean, not merely unchecked.
      - name: No em dashes
        run: |
          hits=$(grep -rn $'—' --include='*.md' --include='*.sh' --include='*.json' . || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Em dash found. House style is a plain hyphen."
            exit 1
          fi
          echo "No em dashes."

      # Every rule this skill teaches about not truncating a diagnostic applies
      # to the toolkit itself, and `probe` lines are where that rule bites: what
      # a probe prints IS the evidence, so a `head` there cuts the line someone
      # needed and the loss is invisible in the log.
      #
      # Scoped to probe lines deliberately. A first attempt flagged every `head`
      # and `2>/dev/null` in steps/ and caught nine capability checks - "which
      # version of kubectl", "is there a default route" - where a one-line answer
      # is the whole answer and a suppressed error means "not installed" rather
      # than a finding. A check that needs nine exemptions on a two-file corpus
      # asserts nothing; this one asserts the rule that matters.
      - name: Probes do not truncate their own evidence
        run: |
          hits=$(grep -nE '^[[:space:]]*probe(_opt)? .*\|[[:space:]]*(head|tail)\b' \
                 skills/heliograph/toolkit/steps/*.sh || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A probe truncates its own output. See references/method.md rule 4."
            exit 1
          fi
          echo "No truncated probes."

  installers:
    name: Installers actually install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Claude install
        run: |
          ./install.sh
          test -L "$HOME/.claude/skills/heliograph" || { echo "not a symlink"; exit 1; }
          test -f "$HOME/.claude/skills/heliograph/SKILL.md" || { echo "SKILL.md missing"; exit 1; }

      - name: Codex install, and the rewritten paths resolve
        run: |
          ./install-codex.sh
          target="$HOME/.codex/skills/heliograph"
          test -f "$target/SKILL.md" || { echo "SKILL.md missing"; exit 1; }
          grep -q 'CLAUDE_SKILL_DIR' "$target/SKILL.md" && { echo "variable not substituted"; exit 1; }
          for sub in references scripts toolkit; do
            test -d "$target/$sub" || { echo "$sub/ not linked"; exit 1; }
          done
          # Every path the rewritten SKILL.md names must exist on disk.
          fail=0
          while IFS= read -r p; do
            [ -e "$p" ] || { echo "rewritten path does not exist: $p"; fail=1; }
          done < <(grep -o "$target[^ \`\"']*" "$target/SKILL.md" | sort -u)
          exit $fail

      - name: No dangling symlinks after either install
        run: |
          found=$(find "$HOME/.claude/skills/heliograph/" "$HOME/.codex/skills/heliograph/" -xtype l 2>/dev/null || true)
          if [ -n "$found" ]; then echo "::error::dangling symlinks:"; echo "$found"; exit 1; fi
          echo "No dangling symlinks."

  toolkit:
    name: The toolkit captures a run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The one thing worth exercising end to end. A capture that loses the
      # timestamps, swallows an exit code, or writes nothing on failure is the
      # failure mode this whole repo exists to avoid, and it is invisible until
      # someone is waiting on the far side of a gap for a log that never comes.
      - name: Bootstrap into a fresh repo
        run: |
          ./skills/heliograph/scripts/bootstrap.sh /tmp/transport
          cd /tmp/transport
          test -f .gitignore || { echo "gitignore not installed as .gitignore"; exit 1; }
          test ! -e gitignore || { echo "undotted gitignore left behind"; exit 1; }
          git init -q && git add -A && git -c user.email=ci@example.com -c user.name=ci commit -qm init

      - name: A passing step is captured, timestamped and complete
        run: |
          cd /tmp/transport
          PUSH=0 ./run.sh env
          log=$(ls -t ops-logs/env-*.txt | head -1)
          grep -q 'git commit  :' "$log" || { echo "header missing provenance"; exit 1; }
          grep -q 'RESULT       : ' "$log" || { echo "footer missing"; exit 1; }
          # Every captured line carries a UTC clock. Header and footer are
          # written outside cap_run and are exempt; the body is not.
          bad=$(sed -n '/^---------- /,$p' "$log" \
                | grep -vE '^[0-9]{2}:[0-9]{2}:[0-9]{2} \| |^$|^-{5}|^={5}| finished UTC | exit code | RESULT ' \
                | head -5)
          if [ -n "$bad" ]; then echo "untimestamped lines:"; echo "$bad"; exit 1; fi

      - name: A failing step still produces a log and the real exit code
        run: |
          cd /tmp/transport
          printf '#!/usr/bin/env bash\nset -uo pipefail\necho "this step fails"\nexit 7\n' > steps/boom.sh
          chmod +x steps/boom.sh
          sed -i 's|^  net)|  boom) CMD=(./steps/boom.sh) ;;\n  net)|' run.sh
          set +e; PUSH=0 ./run.sh boom; rc=$?; set -e
          [ "$rc" = "7" ] || { echo "expected exit 7, got $rc"; exit 1; }
          log=$(ls -t ops-logs/boom-*.txt | head -1)
          grep -q 'exit code    : 7' "$log" || { echo "footer lost the exit code"; exit 1; }
          grep -q 'RESULT       : FAILED' "$log" || { echo "footer did not mark failure"; exit 1; }

      - name: An unknown step exits 2 having done nothing
        run: |
          cd /tmp/transport
          before=$(ls ops-logs | wc -l)
          set +e; PUSH=0 ./run.sh nosuchstep >/dev/null 2>&1; rc=$?; set -e
          [ "$rc" = "2" ] || { echo "expected exit 2, got $rc"; exit 1; }
          [ "$(ls ops-logs | wc -l)" = "$before" ] || { echo "an unknown step wrote a log"; exit 1; }

      - name: A gated step refuses without CONFIRM
        run: |
          cd /tmp/transport
          sed -i 's|^  boom)|  apply) CMD=(./steps/boom.sh) ;;\n  boom)|' run.sh
          set +e; PUSH=0 ./run.sh apply >/dev/null 2>&1; rc=$?; set -e
          [ "$rc" = "3" ] || { echo "a state-changing step ran without CONFIRM=yes (exit $rc)"; exit 1; }

  tests:
    name: Toolkit unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assertions under tests/
        run: ./tests/run-tests.sh

  # PR 3 task 4's own requirement: tests/test-container.sh builds the image
  # from skills/heliograph/toolkit/docker/Dockerfile as its own first step
  # (see that file's header comment), and it is already part of the sweep
  # the `tests` job above runs via run-tests.sh. That alone is not enough:
  # test-container.sh SKIPS LOUDLY, not fails, when no container runtime is
  # reachable - the right behaviour on a developer laptop that may not have
  # Docker, and exactly the wrong one to let pass unnoticed in CI. A green
  # `tests` job in which test-container.sh quietly skipped would read
  # identically to one where every property it checks was actually verified,
  # which is the precise failure shape this task exists to prevent. Nothing
  # in the `tests` job above asserts against that; this job does, as its own
  # named, required check, so the failure shows up as "the container job
  # broke" rather than being invisible inside a job that still says "tests
  # passed".
  #
  # GitHub-hosted ubuntu-latest runners ship Docker with the daemon already
  # running, so the skip path should never trigger here - if it does, that is
  # itself the finding: something about the runner changed underneath this
  # workflow, and this job is what makes that loud instead of silent.
  #
  # This also doubles as task 4's PR-time build check ("prove the Dockerfile
  # still builds, without pushing"): a passing `docker build` is the very
  # first thing test-container.sh does, before any assertion runs, and this
  # job never logs in to a registry or carries any push credential - there is
  # no way for it to publish anything even by accident.
  container:
    name: Container image builds, and its tests run unskipped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run tests/test-container.sh and refuse a silent skip
        run: |
          set +e
          ./tests/test-container.sh 2>&1 | tee /tmp/test-container.out
          rc="${PIPESTATUS[0]}"
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::tests/test-container.sh failed (exit $rc)"
            exit 1
          fi
          # TWO GUARDS, because the file can skip at two different scales and
          # this job's requirement is that neither happens here.
          #
          # 1. The whole-file banner: no container runtime at all, printed
          #    before tests/assert.sh is even sourced. assert.sh's own
          #    vocabulary is "ok"/"FAIL"/"SKIP", and every skip it prints
          #    starts a line with "SKIP" too, so this catches both shapes.
          if grep -q '^SKIP' /tmp/test-container.out; then
            echo "::error::tests/test-container.sh skipped something instead of running it. GitHub-hosted ubuntu-latest runners ship Docker, podman, ssh-agent and ssh-keygen, so this must never happen in CI; investigate the runner rather than ignore this."
            exit 1
          fi
          # 2. The COUNT, from assert.sh's own summary line, which is the
          #    guard that does not depend on anyone remembering to make a
          #    future skip message uppercase. The per-section skips were all
          #    lowercase until this was written - including the one guarding
          #    the ownership-mismatch regression - so guard 1 alone proved
          #    only that the file had not skipped in its entirety.
          if ! grep -qE '^test-container\.sh: [0-9]+ passed, [0-9]+ failed, 0 skipped$' /tmp/test-container.out; then
            echo "::error::tests/test-container.sh did not report '0 skipped' (or printed no summary at all). Sections that did not run cannot be treated as sections that passed."
            exit 1
          fi

  # The same argument as the container job, for the same reason.
  # tests/test-powershell.sh skips its ps_step half when no PowerShell is on
  # PATH, which is right on a Linux developer box and wrong to let pass here.
  #
  # It matters more than usual because NOTHING ELSE IN CI READS A .ps1 AT ALL.
  # bash -n and shellcheck sweep *.sh and step straight over agent.ps1 and the
  # PowerShell steps, so without this job a syntax error in one of them would
  # go green here and only surface on a Windows control node, which is the one
  # machine nobody can log in to. That is the exact failure this repo exists to
  # prevent.
  #
  # GitHub-hosted ubuntu-latest runners ship pwsh, so the skip path should never
  # trigger. If it does, that is itself the finding.
  powershell:
    name: PowerShell parses, and its tests run unskipped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Every .ps1 in the repo parses
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.ps1 -Recurse -File |
                   Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          if ($files.Count -eq 0) {
            Write-Output "::error::no .ps1 files found, so this job checked nothing"
            exit 1
          }
          $bad = 0
          foreach ($f in $files) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $bad++
              foreach ($e in $errors) {
                Write-Output "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            } else {
              Write-Output "ok   $($f.FullName)"
            }
          }
          Write-Output "$($files.Count) file(s) parsed, $bad bad"
          exit $bad

      - name: Run tests/test-powershell.sh and refuse a silent skip
        run: |
          set +e
          ./tests/test-powershell.sh 2>&1 | tee /tmp/test-powershell.out
          rc="${PIPESTATUS[0]}"
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::tests/test-powershell.sh failed (exit $rc)"
            exit 1
          fi
          # The file's own loud-skip banner, and assert.sh's SKIP lines.
          if grep -q '^SKIP' /tmp/test-powershell.out; then
            echo "::error::tests/test-powershell.sh skipped something instead of running it. ubuntu-latest ships pwsh, so investigate the runner rather than ignore this."
            exit 1
          fi
          # The count, which does not depend on anyone keeping a future skip
          # message uppercase.
          if ! grep -qE '^test-powershell\.sh: [0-9]+ passed, [0-9]+ failed, 0 skipped$' /tmp/test-powershell.out; then
            echo "::error::tests/test-powershell.sh did not report '0 skipped' (or printed no summary). Assertions that did not run cannot be treated as assertions that passed."
            exit 1
          fi
          # And the whole-file early exit, which returns 0 and prints its own
          # banner rather than a SKIP line.
          if grep -q 'SKIPPING every PowerShell assertion' /tmp/test-powershell.out; then
            echo "::error::tests/test-powershell.sh found no PowerShell interpreter and skipped its ps_step half."
            exit 1
          fi

  # Everything else in this file runs on ubuntu-latest, and for a while that was
  # the whole of CI while the toolkit grew a Windows control node. That left the
  # parts that ONLY exist on Windows running nowhere:
  #
  #   - agent.ps1's bash discovery, including the registry lookup that is the
  #     only thing which finds bash.exe on a default Git for Windows install,
  #     and the System32 exclusion that keeps WSL out of it
  #   - ps_step against Windows PowerShell 5.1. The Linux job uses pwsh 7, and
  #     5.1 is what a Server 2022 box actually has
  #   - the line-ending probe's CR-TOLERANT branch, which by construction can
  #     never be taken on Linux
  #   - .gitattributes doing its job against a real core.autocrlf=true
  #
  # This repo is public, so windows-latest costs nothing. There was no reason
  # for the gap other than not having looked.
  windows:
    name: The toolkit runs on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: What this runner actually has
        shell: pwsh
        run: |
          "git      : $((Get-Command git -EA SilentlyContinue).Source)"
          "bash     : $((Get-Command bash -EA SilentlyContinue).Source)"
          "autocrlf : $(git config --get core.autocrlf)"
          foreach ($k in 'HKLM:\SOFTWARE\GitForWindows','HKLM:\SOFTWARE\WOW6432Node\GitForWindows') {
            try { "$k -> $((Get-ItemProperty $k -Name InstallPath -EA Stop).InstallPath)" }
            catch { "$k -> absent" }
          }

      # SIZE ON DISK vs SIZE IN THE BLOB, and not a grep, because on Git bash the
      # obvious grep lies. `grep -lrU $'\r'` reported every .sh file as CRLF here
      # while `tr`, `git status` and the blob all said the tree was clean LF:
      # MSYS grep and MSYS shell redirection disagree about text translation, so
      # a CR-hunting grep is not a measurement you can trust on this platform.
      #
      # A file rewritten to CRLF is longer than its blob by exactly its line
      # count, and neither `stat` nor a pipe does any translation, so this
      # compares two numbers that cannot be argued with.
      - name: .gitattributes survived the checkout, so a Linux clone would work
        shell: bash
        run: |
          set -uo pipefail
          bad=0
          checked=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            checked=$((checked + 1))
            disk=$(stat -c %s "$f")
            blob=$(git cat-file blob "HEAD:$f" | wc -c | tr -d ' ')
            if [ "$disk" != "$blob" ]; then
              bad=$((bad + 1))
              lines=$(git cat-file blob "HEAD:$f" | wc -l | tr -d ' ')
              echo "  $f: $disk bytes on disk, $blob in the blob, difference $((disk - blob)) over $lines lines"
              echo "     attrs: $(git check-attr text eol -- "$f" | tr '\n' ' ')"
            fi
          done < <(git ls-files '*.sh' '*.ps1')
          echo "compared $checked files against their blobs"
          if [ "$checked" -eq 0 ]; then
            echo "::error::no files were compared, so this check verified nothing"
            exit 1
          fi
          if [ "$bad" -ne 0 ]; then
            echo "  core.autocrlf: $(git config --get core.autocrlf)"
            echo "::error::$bad file(s) differ in size from their blob, so eol=lf was not honoured and a Linux clone of this repo would get CRLF"
            exit 1
          fi
          echo "every file is byte-identical to its blob, so eol=lf held against core.autocrlf=$(git config --get core.autocrlf)"

      - name: agent.ps1 finds bash and hands over
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path tw | Out-Null
          bash ./skills/heliograph/scripts/bootstrap.sh tw 2>&1 | Out-Null
          Push-Location tw
          git init -q .
          git config user.email ci@example.invalid
          git config user.name ci
          $out = & powershell.exe -NoProfile -File .\agent.ps1 --check 2>&1 | Out-String
          Pop-Location
          Write-Output $out
          # The launcher must locate bash. On a default install bash.exe is NOT
          # on PATH, so this failing means the registry lookup broke.
          if ($out -notmatch 'agent\.ps1: using .*bash\.exe') {
            Write-Output "::error::agent.ps1 did not report the bash it selected"; exit 1
          }
          # And having found it, the preflight must actually have run.
          foreach ($needle in 'sed -u', 'base64 -w0', 'line endings') {
            if ($out -notmatch [regex]::Escape($needle)) {
              Write-Output "::error::preflight did not report '$needle', so handover did not happen"; exit 1
            }
          }
          Write-Output "agent.ps1 found bash and start.sh ran its preflight"

      - name: The CR-tolerant branch of the line-ending probe, which Linux cannot reach
        shell: bash
        run: |
          set -uo pipefail
          cd tw
          out=$(./start.sh --check 2>&1 | grep -i 'line endings')
          echo "$out"
          case "$out" in
            *"tolerates CR"*) echo "took the tolerant branch, as Git for Windows should" ;;
            FAIL*) echo "::error::the preflight blocked on a Windows control node that works"; exit 1 ;;
            *) echo "::error::unexpected line-endings verdict: $out"; exit 1 ;;
          esac

      - name: A PowerShell step through the real capture, on Windows PowerShell
        shell: bash
        run: |
          set -uo pipefail
          cd tw
          PUSH=0 ./run.sh win >/dev/null 2>&1; rc=$?
          log=$(ls -t ops-logs/win-*.txt 2>/dev/null | head -1)
          [ -n "$log" ] || { echo "::error::no log produced by the win step"; exit 1; }
          [ "$rc" = "0" ] || { echo "::error::win-snapshot reported failure ($rc); the exit code is leaking again"; exit 1; }
          cr=$(tr -cd '\r' < "$log" | wc -c | tr -d ' ')
          esc=$(tr -cd '\033' < "$log" | wc -c | tr -d ' ')
          stamped=$(grep -cE '^[0-9]{2}:[0-9]{2}:[0-9]{2} \| ' "$log")
          echo "log=$log rc=$rc cr=$cr esc=$esc stamped=$stamped"
          [ "$cr"  = "0" ] || { echo "::error::$cr CR bytes reached the log"; exit 1; }
          [ "$esc" = "0" ] || { echo "::error::$esc ANSI bytes reached the log"; exit 1; }
          [ "$stamped" -gt 0 ] || { echo "::error::no timestamped lines in the log"; exit 1; }
          grep -q 'identity' "$log" || { echo "::error::the step's own output is missing"; exit 1; }

      - name: The suite's Windows-relevant files, unskipped
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          for f in tests/test-powershell.sh tests/test-remote.sh; do
            echo "--- $f"
            ./$f 2>&1 | tee "/tmp/$(basename "$f").out"
            [ "${PIPESTATUS[0]}" -eq 0 ] || rc=1
            if grep -q '^SKIP' "/tmp/$(basename "$f").out"; then
              echo "::error::$f skipped an assertion on Windows, where it should not"; rc=1
            fi
          done
          exit $rc

  # Single required check for branch protection. Adding a job above does not mean
  # remembering to add it to the protection rule - it only needs listing here.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate
      - installers
      - toolkit
      - tests
      - container
      - windows
      - powershell
    steps:
      - name: Fail if any job did not succeed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a job did not succeed"; exit 1; }
          done
